<title>Planilla de Sonido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: banco de evaluación tipo consola. Pestañas por año, tarjetas de alumno con selector 0-3 por consigna, puestos a la derecha. */
:root {
  --bg: #ECEFF1;
  --surface: #FFFFFF;
  --ink: #12171C;
  --muted: #55616C;
  --line: #D2D8DD;
  --accent: #0A6E6A;
  --accent-soft: #DCEFEE;
  --s0: #B3342B;
  --s1: #B7791F;
  --s2: #2F7D4F;
  --s3: #0A6E6A;
  --on: #FFFFFF;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1417; --surface: #171E23; --ink: #E7ECEF; --muted: #95A2AC; --line: #2B353C;
    --accent: #45C7BB; --accent-soft: #14302F;
    --s0: #E8736B; --s1: #E3A94B; --s2: #5DBE86; --s3: #45C7BB; --on: #0B1013;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1417; --surface: #171E23; --ink: #E7ECEF; --muted: #95A2AC; --line: #2B353C;
  --accent: #45C7BB; --accent-soft: #14302F;
  --s0: #E8736B; --s1: #E3A94B; --s2: #5DBE86; --s3: #45C7BB; --on: #0B1013;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 6vw, 42px); line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; }
.sub { margin: 6px 0 0; color: var(--muted); }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.tabs { display: flex; gap: 6px; }
.tab { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 8px 16px; min-height: 44px; font: 600 20px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
.tab small { font: 500 11px/1 var(--body); letter-spacing: 0.02em; text-transform: none; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on); }
.tab[aria-selected="true"] small { color: var(--on); opacity: 0.85; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 22px; height: 22px; border-radius: 4px; display: inline-grid; place-items: center; font: 600 12px var(--mono); color: var(--on); }
.sw[data-v="0"] { background: var(--s0); } .sw[data-v="1"] { background: var(--s1); }
.sw[data-v="2"] { background: var(--s2); } .sw[data-v="3"] { background: var(--s3); }

details.crit { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
details.crit summary { cursor: pointer; padding: 12px 14px; font: 600 18px var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.crit ol { margin: 0; padding: 0 14px 14px 14px; list-style: none; display: grid; gap: 10px; }
.crit li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; }
.crit .n { font: 600 13px var(--mono); color: var(--accent); padding-top: 2px; }
.crit b { font-weight: 600; }
.crit p { margin: 0; color: var(--muted); font-size: 14px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.name { width: 100%; min-width: 0; font: 600 22px/1.1 var(--display); letter-spacing: 0.02em; color: var(--ink); background: transparent; border: 0; border-bottom: 1px dashed var(--line); padding: 4px 0; border-radius: 0; }
.name:focus { border-bottom-color: var(--accent); }
.total { font: 600 20px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.total small { color: var(--muted); font-size: 13px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.15s; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 172px; gap: 10px; align-items: center; }
.lbl { font-size: 14px; min-width: 0; }
.lbl em { font: 600 12px var(--mono); font-style: normal; color: var(--accent); margin-right: 6px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.seg button { appearance: none; min-height: 40px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 5px; font: 600 15px var(--mono); cursor: pointer; }
.seg button:hover { border-color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--on); border-color: transparent; }
.seg button[aria-pressed="true"][data-v="0"] { background: var(--s0); }
.seg button[aria-pressed="true"][data-v="1"] { background: var(--s1); }
.seg button[aria-pressed="true"][data-v="2"] { background: var(--s2); }
.seg button[aria-pressed="true"][data-v="3"] { background: var(--s3); }
.foot { display: flex; justify-content: flex-end; }
.link { appearance: none; background: none; border: 0; color: var(--muted); font: 500 13px var(--body); text-decoration: underline; cursor: pointer; padding: 6px 2px; min-height: 32px; }
.link.armed { color: var(--s0); font-weight: 600; }

.rank { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; position: sticky; top: 12px; display: flex; flex-direction: column; gap: 10px; }
.rank h2 { font-size: 22px; text-transform: uppercase; letter-spacing: 0.04em; }
.rank ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rank li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
.rank li:first-child { border-top: 0; }
.pos { font: 600 16px var(--mono); color: var(--accent); }
.rn { overflow-wrap: anywhere; }
.rt { font: 600 14px var(--mono); font-variant-numeric: tabular-nums; }
.rank .hint { margin: 0; color: var(--muted); font-size: 13px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { appearance: none; min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 14px var(--body); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on); }
.btn.danger { color: var(--s0); }
.status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.paste { width: 100%; min-height: 120px; font: 13px var(--mono); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.note { margin: 0; color: var(--muted); font-size: 13px; }
.send { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lab { font: 600 13px var(--body); color: var(--muted); }
.field { flex: 1 1 200px; min-width: 0; max-width: 320px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: 15px var(--body); }
.btn:disabled { opacity: 0.6; cursor: default; }

@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .rank { position: static; order: -1; } }
@media (max-width: 380px) { .row { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<main class="wrap">
  <div class="top">
    <div>
      <h1>Planilla de Sonido</h1>
      <p class="sub">Evaluación para el festival. Puntaje de 0 a 3 por consigna.</p>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Año"></div>
  </div>

  <div class="legend" id="legend"></div>
  <details class="crit"><summary>Consignas y qué observar</summary><ol id="critList"></ol></details>

  <div class="layout">
    <section class="cards" id="cards" aria-label="Alumnos"></section>
    <aside class="rank" id="rank" aria-label="Puestos"></aside>
  </div>

  <div class="send">
    <label class="lab" for="evaluador">Tu nombre</label>
    <input class="field" id="evaluador" autocomplete="name" placeholder="Quién evalúa">
    <button class="btn primary" data-act="send" id="sendBtn">Enviar por email</button>
  </div>
  <div class="actions">
    <button class="btn" data-act="add" id="addBtn">Agregar alumno</button>
    <button class="btn" data-act="copy" id="copyBtn">Copiar para planilla</button>
    <span id="resetSlot"></span>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>
  <textarea class="paste" id="paste" readonly hidden aria-label="Planilla para copiar"></textarea>
  <p class="note">Los nombres de ejemplo son editables. Lo que cargues queda guardado en este navegador. Pegá lo copiado en Excel o Google Sheets.</p>
</main>

<script>
(function () {
  var KEY = "planilla-sonido-v1";
  // Clave pública de Web3Forms (web3forms.com). Pegala acá entre las comillas.
  var ACCESS_KEY = "";
  var ENDPOINT = "https://api.web3forms.com/submit";
  var LEVELS = ["No lo logra", "Con ayuda", "Solo", "Solo y lo explica"];
  var YEARS = {
    "4to": { label: "4to año", sub: "Monitoreo", items: [
      { t: "Conectar un mic", d: "Elige el cable XLR, lo conecta y ubica en qué canal entra. Procedimiento ordenado." },
      { t: "Phantom", d: "Explica cuándo hace falta (condensadores, DI activas) y lo activa bajando el nivel antes, sin golpes." },
      { t: "Ganancia", d: "Ajusta la entrada mirando el medidor: sin saturar y sin quedar muy bajo." },
      { t: "Fader y envío a monitor", d: "Sube el canal y lo manda a un aux con un volumen razonable." },
      { t: "Feedback", d: "Identifica el acople y lo resuelve: baja nivel, mueve el mic o ecualiza." }
    ] },
    "5to": { label: "5to año", sub: "PA, ruteo y EQ", items: [
      { t: "Ruteo de entrada", d: "Asigna una entrada física distinta a un canal y verifica que llega la señal." },
      { t: "Salida al PA", d: "Confirma que el canal llega al L/R y que la salida física está bien asignada. Si algo está mal, lo encuentra." },
      { t: "EQ en el canal", d: "Le saca graves a la voz (low cut y/o banda de graves) y explica por qué: manipulación, viento, claridad." },
      { t: "Acople en el Aux 1", d: "Saca el acople con un corte angosto en el EQ del Aux 1, sin tocar el canal ni el PA, y explica por qué ahí." }
    ] }
  };
  var S = load();
  var armed = null, resetArmed = false;

  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
  function blank(year, name) {
    var n = YEARS[year].items.length, sc = [];
    for (var i = 0; i < n; i++) sc.push(null);
    return { id: uid(), name: name, scores: sc };
  }
  function defaults() {
    var d = { tab: "4to", data: {} };
    Object.keys(YEARS).forEach(function (y) {
      d.data[y] = [];
      for (var i = 1; i <= 4; i++) d.data[y].push(blank(y, "Alumno " + i));
    });
    return d;
  }
  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) { s = null; }
    if (!s || !s.data) s = defaults();
    Object.keys(YEARS).forEach(function (y) {
      if (!Array.isArray(s.data[y])) s.data[y] = [];
      var n = YEARS[y].items.length;
      s.data[y].forEach(function (st) {
        if (!Array.isArray(st.scores)) st.scores = [];
        while (st.scores.length < n) st.scores.push(null);
        st.scores = st.scores.slice(0, n);
        if (typeof st.name !== "string") st.name = "";
      });
    });
    if (!YEARS[s.tab]) s.tab = "4to";
    if (typeof s.evaluador !== "string") s.evaluador = "";
    return s;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function total(st) { return st.scores.reduce(function (a, v) { return a + (v == null ? 0 : v); }, 0); }
  function scored(st) { return st.scores.some(function (v) { return v != null; }); }
  function $(id) { return document.getElementById(id); }
  function setStatus(t) { $("status").textContent = t; }

  function renderTabs() {
    $("tabs").innerHTML = Object.keys(YEARS).map(function (y) {
      return '<button class="tab" role="tab" data-act="tab" data-y="' + y + '" aria-selected="' + (S.tab === y) + '">' + YEARS[y].label + "<small>" + YEARS[y].sub + "</small></button>";
    }).join("");
  }
  function renderLegend() {
    $("legend").innerHTML = LEVELS.map(function (l, i) {
      return '<span><i class="sw" data-v="' + i + '">' + i + "</i>" + l + "</span>";
    }).join("");
  }
  function renderCrit() {
    $("critList").innerHTML = YEARS[S.tab].items.map(function (it, i) {
      return '<li><span class="n">C' + (i + 1) + "</span><div><b>" + esc(it.t) + "</b><p>" + esc(it.d) + "</p></div></li>";
    }).join("");
  }
  function renderCards() {
    var items = YEARS[S.tab].items, max = items.length * 3;
    $("cards").innerHTML = S.data[S.tab].map(function (st) {
      var t = total(st);
      var rows = items.map(function (it, i) {
        var btns = [0, 1, 2, 3].map(function (v) {
          return '<button data-act="score" data-id="' + st.id + '" data-i="' + i + '" data-v="' + v + '" aria-pressed="' + (st.scores[i] === v) + '" title="' + v + ": " + LEVELS[v] + '" aria-label="' + esc(it.t) + ", " + v + ": " + LEVELS[v] + '">' + v + "</button>";
        }).join("");
        return '<div class="row"><div class="lbl"><em>C' + (i + 1) + "</em>" + esc(it.t) + '</div><div class="seg">' + btns + "</div></div>";
      }).join("");
      var isArmed = armed === st.id;
      return '<article class="card" data-card="' + st.id + '"><div class="head"><input class="name" data-id="' + st.id + '" value="' + esc(st.name) + '" placeholder="Nombre del alumno" aria-label="Nombre del alumno"><div class="total" data-total="' + st.id + '">' + t + "<small>/" + max + '</small></div></div><div class="bar"><i data-bar="' + st.id + '" style="width:' + (t / max * 100) + '%"></i></div>' + rows + '<div class="foot"><button class="link' + (isArmed ? " armed" : "") + '" data-act="remove" data-id="' + st.id + '">' + (isArmed ? "Confirmar: quitar alumno" : "Quitar alumno") + "</button></div></article>";
    }).join("");
  }
  function renderRank() {
    var items = YEARS[S.tab].items, max = items.length * 3;
    var list = S.data[S.tab].map(function (st) { return { st: st, t: total(st) }; });
    list.sort(function (a, b) { return b.t - a.t; });
    var prev = null, pos = 0;
    var lis = list.map(function (r, i) {
      if (r.t !== prev) pos = i + 1;
      prev = r.t;
      return '<li><span class="pos">' + (scored(r.st) ? pos : "–") + '</span><span class="rn">' + (esc(r.st.name) || "Sin nombre") + '</span><span class="rt">' + r.t + "/" + max + "</span></li>";
    }).join("");
    var done = S.data[S.tab].filter(scored).length;
    $("rank").innerHTML = "<h2>Puestos " + YEARS[S.tab].label + "</h2>" + (lis ? "<ol>" + lis + "</ol>" : '<p class="hint">Agregá alumnos para empezar.</p>') + '<p class="hint">' + done + " de " + S.data[S.tab].length + " con puntaje cargado.</p>";
  }
  function renderReset() {
    $("resetSlot").innerHTML = resetArmed
      ? '<button class="btn danger" data-act="reset-yes">Borrar puntajes de ' + YEARS[S.tab].label + '</button> <button class="btn" data-act="reset-no">Cancelar</button>'
      : '<button class="btn" data-act="reset">Borrar puntajes</button>';
  }
  function renderAll() { renderTabs(); renderCrit(); renderCards(); renderRank(); renderReset(); }
  function findSt(id) { return S.data[S.tab].filter(function (s) { return s.id === id; })[0]; }

  function tsv() {
    var items = YEARS[S.tab].items;
    var head = ["Alumno"].concat(items.map(function (_, i) { return "C" + (i + 1); }), ["Total"]).join("\t");
    var rows = S.data[S.tab].map(function (st) {
      return [st.name.replace(/\t/g, " ")].concat(st.scores.map(function (v) { return v == null ? "" : v; }), [total(st)]).join("\t");
    });
    return [head].concat(rows).join("\n");
  }
  function showPaste(text) {
    var ta = $("paste"); ta.hidden = false; ta.value = text; ta.focus(); ta.select();
    setStatus("Seleccioná el texto y copialo.");
  }
  function doCopy() {
    var text = tsv();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        $("paste").hidden = true; setStatus("Planilla copiada. Pegala en Excel o Sheets.");
      }, function () { showPaste(text); });
    } else { showPaste(text); }
  }

  function buildMessage() {
    var y = YEARS[S.tab], items = y.items, max = items.length * 3, lines = [];
    lines.push("Evaluación de sonido: " + y.label + " (" + y.sub + ")");
    lines.push("Evaluador: " + S.evaluador.trim());
    lines.push("Fecha: " + new Date().toLocaleDateString("es-AR"));
    lines.push("");
    lines.push("Escala: 0 no lo logra, 1 con ayuda, 2 solo, 3 solo y lo explica");
    lines.push("");
    items.forEach(function (it, i) { lines.push("C" + (i + 1) + ": " + it.t); });
    lines.push("");
    S.data[S.tab].forEach(function (st) {
      lines.push((st.name || "Sin nombre") + ": " + st.scores.map(function (v) { return v == null ? "-" : v; }).join(" | ") + "  =  " + total(st) + "/" + max);
    });
    return lines.join("\n");
  }
  function doSend() {
    if (!ACCESS_KEY) { setStatus("Falta configurar la clave de envío."); return; }
    if (!S.evaluador.trim()) { setStatus("Escribí tu nombre antes de enviar."); $("evaluador").focus(); return; }
    if (!S.data[S.tab].some(scored)) { setStatus("Cargá al menos un puntaje antes de enviar."); return; }
    var btn = $("sendBtn"), who = S.evaluador.trim();
    btn.disabled = true; setStatus("Enviando...");
    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ access_key: ACCESS_KEY, subject: "Evaluación de sonido " + YEARS[S.tab].label + " - " + who, from_name: who, message: buildMessage() })
    }).then(function (r) { return r.json(); }).then(function (j) {
      btn.disabled = false;
      setStatus(j && j.success ? "Evaluación enviada." : "No se pudo enviar. Usá Copiar para planilla.");
    }).catch(function () {
      btn.disabled = false; setStatus("No se pudo enviar. Usá Copiar para planilla.");
    });
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "tab") { S.tab = b.getAttribute("data-y"); armed = null; resetArmed = false; $("paste").hidden = true; setStatus(""); save(); renderAll(); }
    else if (act === "score") {
      var st = findSt(b.getAttribute("data-id")); if (!st) return;
      var i = +b.getAttribute("data-i"), v = +b.getAttribute("data-v");
      st.scores[i] = st.scores[i] === v ? null : v;
      armed = null; save(); renderCards(); renderRank();
    }
    else if (act === "add") {
      var n = S.data[S.tab].length + 1;
      S.data[S.tab].push(blank(S.tab, "Alumno " + n));
      save(); renderCards(); renderRank();
      var inputs = document.querySelectorAll(".name"); var last = inputs[inputs.length - 1]; if (last) { last.focus(); last.select(); }
    }
    else if (act === "remove") {
      var id = b.getAttribute("data-id");
      if (armed === id) { S.data[S.tab] = S.data[S.tab].filter(function (s) { return s.id !== id; }); armed = null; save(); renderCards(); renderRank(); }
      else { armed = id; renderCards(); }
    }
    else if (act === "copy") doCopy();
    else if (act === "send") doSend();
    else if (act === "reset") { resetArmed = true; renderReset(); }
    else if (act === "reset-no") { resetArmed = false; renderReset(); }
    else if (act === "reset-yes") {
      S.data[S.tab].forEach(function (s) { s.scores = s.scores.map(function () { return null; }); });
      resetArmed = false; save(); renderCards(); renderRank(); renderReset(); setStatus("Puntajes borrados.");
    }
  });
  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.id === "evaluador") { S.evaluador = el.value; save(); return; }
    if (!el.classList || !el.classList.contains("name")) return;
    var st = findSt(el.getAttribute("data-id")); if (!st) return;
    st.name = el.value; save(); renderRank();
  });

  $("evaluador").value = S.evaluador;
  renderLegend();
  renderAll();
})();
</script>
